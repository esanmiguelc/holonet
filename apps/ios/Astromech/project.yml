name: Astromech
options:
  bundleIdPrefix: com.emmanuelsanmiguel
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Astromech:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emmanuelsanmiguel.astromech
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Astromech
        INFOPLIST_KEY_NSCameraUsageDescription: Astromech uses the camera to scan receipts so their fiscal details can be read on your device.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AstromechTests
  AstromechTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Astromech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emmanuelsanmiguel.astromech.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Astromech.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Astromech
        BUNDLE_LOADER: $(TEST_HOST)
